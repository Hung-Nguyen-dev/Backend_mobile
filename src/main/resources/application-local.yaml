# GitHub không cho commit token trong application-dev.yaml — mỗi máy tự điền secret ở đây.
# Sao chép thành application-local.yaml (file đó đã .gitignore, không push).
#
# Chạy (PowerShell: bắt buộc ngoặc kép quanh -D, nếu không Maven báo lỗi ".run.profiles=dev"):
#   mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
# Hoặc: $env:SPRING_PROFILES_ACTIVE="dev"; mvn spring-boot:run
# (profile dev tự kèm local — xem spring.profiles.group trong application.yaml)
#
travel:
  flight:
    duffel:
      api-key: YOUR_DUFFEL_TEST_TOKEN
  payment:
    vnpay:
      tmn-code: YOUR_VNPAY_TMN
      # Phải trùng đúng chuỗi VNPAY gửi (không thừa dấu cách/xuống dòng). Email có 2 mã khác nhau → chỉ một là đúng sandbox.
      hash-secret: YOUR_VNPAY_HASH_SECRET
  places:
    serp-api:
      enabled: true
      api-key: YOUR_SERP_API_KEY

cloudinary:
  cloud-name: YOUR_CLOUDINARY_CLOUD_NAME
  api-key: YOUR_CLOUDINARY_API_KEY
  api-secret: YOUR_CLOUDINARY_API_SECRET

