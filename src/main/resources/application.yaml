spring:
  application:
    name: ungdunglapkehoachdulich
  # Khi chạy profile dev, luôn nạp thêm local → đọc application-local.yaml (Duffel/VNPAY, đã .gitignore).
  profiles:
    group:
      dev:
        - local
  datasource:
    url: jdbc:mysql://localhost:3306/ung_dung_lap_ke_hoach_du_lich?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dc819mlg2}
  api-key: ${CLOUDINARY_API_KEY:524732391566675}
  api-secret: ${CLOUDINARY_API_SECRET:YZ8Cvxv36ado1URVH8azD3WJ-YQ}

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB