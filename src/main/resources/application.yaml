spring:
  application:
    name: ungdunglapkehoachdulich
  # Khi chạy profile dev, luôn nạp thêm local → đọc application-local.yaml (Duffel/VNPAY, đã .gitignore).
  profiles:
    group:
      dev:
        - local
  datasource:
    url: jdbc:mysql://localhost:3306/ung_dung_lap_ke_hoach_du_lich?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    from: ${MAIL_FROM:noreply@travelapp.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dc819mlg2}
  api-key: ${CLOUDINARY_API_KEY:524732391566675}
  api-secret: ${CLOUDINARY_API_SECRET:YZ8Cvxv36ado1URVH8azD3WJ-YQ}

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

app:
  otp:
    length: 6
    expiry-minutes: 10
    resend-cooldown-seconds: 60
  mail:
    otp-template: "Mã xác thực của bạn là: %s. Mã này sẽ hết hạn trong 10 phút. Vui lòng không chia sẻ mã này với bất kỳ ai."