spring:
  application:
    name: ungdunglapkehoachdulich
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
# Cấu hình kết nối db (Sử dụng H2 để chạy nhanh cục bộ)
  datasource:
    url: jdbc:h2:mem:ungdunglapkehoachdulich;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8081

travel:
  flight:
    provider: ${FLIGHT_PROVIDER:duffel}
    duffel:
      api-key: ${DUFFEL_API_KEY:}
      base-url: ${DUFFEL_BASE_URL:https://api.duffel.com}
      timeout-seconds: ${DUFFEL_TIMEOUT_SECONDS:30}
  payment:
    vnpay:
      base-url: ${VNPAY_BASE_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/callback}
      locale: ${VNPAY_LOCALE:vn}
      order-type: ${VNPAY_ORDER_TYPE:other}
    momo:
      base-url: ${MOMO_BASE_URL:https://test-payment.momo.vn}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:8080/api/v1/payments/momo/redirect}
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/webhook}
      request-type: ${MOMO_REQUEST_TYPE:captureWallet}
      lang: ${MOMO_LANG:vi}

