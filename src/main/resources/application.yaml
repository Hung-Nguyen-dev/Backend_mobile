spring:
  application:
    name: ungdunglapkehoachdulich
  # Khi chạy profile dev, luôn nạp thêm local → đọc application-local.yaml (Duffel/VNPAY, đã .gitignore).
  profiles:
    group:
      dev:
        - local
  datasource:
    url: jdbc:h2:mem:ungdunglapkehoachdulich;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8081
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB