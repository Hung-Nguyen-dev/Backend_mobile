spring:
  application:
    name: ungdunglapkehoachdulich
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Cấu hình kết nối db
  datasource:
    url: jdbc:mysql://localhost:3306/ung_dung_lap_ke_hoach_du_lich_test?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080