# Cấu hình dùng chung cho profile dev (commit lên repo để cả team chạy cùng cấu hình).
# Có thể override bằng biến môi trường nếu cần.
travel:
  flight:
    provider: ${FLIGHT_PROVIDER:duffel}
    duffel:
      api-key: ${DUFFEL_API_KEY:duffel_test_2MCidUuEiMBuEzNFfMkixSoaFmzPnFbObgI2kV3obVw}
      base-url: ${DUFFEL_BASE_URL:https://api.duffel.com}
      timeout-seconds: ${DUFFEL_TIMEOUT_SECONDS:30}
  payment:
    vnpay:
      base-url: ${VNPAY_BASE_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      tmn-code: ${VNPAY_TMN_CODE:7VF65LXO}
      hash-secret: ${VNPAY_HASH_SECRET:360L366VJ4R68VQC87Q3VY7IL9CLFQSL}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/callback}
      locale: ${VNPAY_LOCALE:vn}
      order-type: ${VNPAY_ORDER_TYPE:other}
    momo:
      base-url: ${MOMO_BASE_URL:https://test-payment.momo.vn}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:8080/api/v1/payments/momo/redirect}
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/webhook}
      request-type: ${MOMO_REQUEST_TYPE:captureWallet}
      lang: ${MOMO_LANG:vi}
  # Khach san / nha hang: OSM — Photon (geocode chinh) + Nominatim (du phong) + Overpass (query)
  # Nominatim cong khai hay tra 403 neu User-Agent/From khong hop le hoac IP bi han che
  places:
    user-agent: ${NOMINATIM_USER_AGENT:UngDungLapKeHoachDuLich/1.0 (+https://github.com/mobilebackend)}
    nominatim-from-email: ${NOMINATIM_FROM_EMAIL:}
    nominatim-base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    photon-base-url: ${PHOTON_BASE_URL:https://photon.komoot.io}
    overpass-interpreter-url: ${OVERPASS_URL:https://overpass-api.de/api/interpreter}
    overpass-fallback-urls:
      - https://overpass.kumi.systems/api/interpreter
      - https://overpass.openstreetmap.ru/cgi/interpreter
    timeout-seconds: ${PLACES_TIMEOUT_SECONDS:45}
    default-radius-meters: ${PLACES_DEFAULT_RADIUS_METERS:4000}
    # SerpAPI (Google Maps qua serpapi.com) — chi chay khi enabled + SERPAPI_API_KEY (khong commit key)
    serp-api:
      enabled: ${SERPAPI_PLACES_ENABLED:true}
      api-key: ${SERPAPI_API_KEY:61871f086ffeb8c981a431691f40aa1e162205ba5ff85b0ca73a4591cc538e95}
      hl: vi
      gl: vn
      map-zoom: 14
      fallback-to-osm: true
